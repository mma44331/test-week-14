apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: application
    spec:
      containers:
      - name: api
        image: mma44331/app-weapon:v1
        ports:
        - containerPort: 8000

