apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: application
    spec:
      containers:
      - name: api
        image: mma44331/app-weapon:v6
        ports:
        - containerPort: 8000
        env:
          - name: MYSQL_USER
            value: "root"
          - name: MYSQL_ROOT_PASSWORD
            value: "123"
          - name: MYSQL_DATABASE
            value: "weapons_db"
          - name: MYSQL_HOST
            value: "mysql-svc"
          - name: POOL_NAME
            value: "weapon_pool"
          - name: POOL_SIZE
            value: "5"
          - name: PORT
            value: "3306"

